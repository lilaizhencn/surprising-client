<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; connect-src 'none'">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: __SURFACE__; font-family: -apple-system, sans-serif; }
    #legend { min-height: 40px; padding: 4px 6px; font-size: 10px; line-height: 17px; color: #9299a8; font-variant-numeric: tabular-nums; }
    #legend span { white-space: nowrap; margin-right: 8px; }
    #chart { width: 100%; height: calc(100% - 40px); }
  </style>
</head>
<body>
  <div id="legend" aria-live="polite"></div>
  <div id="chart"></div>
  <script>window.onerror = () => { window.ChartError.postMessage('chart_error'); return true; };</script>
  <!-- CHART_LIBRARY -->
  <!-- CHART_BRIDGE -->
</body>
</html>
